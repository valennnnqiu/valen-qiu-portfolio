<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valen Qiu · Private preview</title>
<script src="analytics.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
:root{--bg:#F4F1EC;--ink:#141414;--muted:#6B6760;--line:#E4DED5;--pink:#C8105F;--pink-dark:#9E0B4A;--err:#B3123F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif}
a{color:var(--pink)}a:hover{color:var(--pink-dark)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);margin:0;white-space:nowrap}

.page{min-height:100vh;display:flex;flex-direction:column;overflow:hidden;transition:opacity .55s ease,transform .55s cubic-bezier(.6,0,.4,1),filter .55s ease}
.page.leave{opacity:0;transform:scale(1.06);filter:blur(8px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:28px clamp(16px,4vw,56px)}
.brand{font-weight:700;font-size:16px;letter-spacing:.02em}
.brand span{color:var(--muted);font-weight:400}
.badge{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:500;color:#3D3A35}

main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:48px;padding:2vh 16px 56px}
.name-wrap{flex:1;width:100%;max-width:1320px;display:flex;align-items:center;touch-action:none;user-select:none}
#name{display:block;width:100%;aspect-ratio:100/17}

.gate{width:100%;max-width:500px;display:flex;flex-direction:column;align-items:center;gap:22px}
.row{align-self:stretch;display:flex;align-items:flex-end;gap:12px}
.avatar{flex:none;width:60px;height:60px;margin-bottom:-2px}
.bubble{flex:1;min-width:0;background:#fff;border-radius:24px 24px 24px 8px;padding:18px 22px;box-shadow:0 10px 30px rgba(20,20,20,.07);font-size:19px;line-height:1.45;display:flex;gap:12px;align-items:flex-start;animation:in .5s ease-out both}
.bubble .spark{flex:none;margin-top:5px}
.caret{display:inline-block;width:3px;height:1.05em;background:var(--pink);margin-left:3px;vertical-align:-3px;animation:blink 1s steps(1) infinite}
.nowrap{white-space:nowrap}

.code{position:relative}
.code input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;cursor:text;z-index:2;font-size:16px}
.cells{display:flex;gap:14px}
.cells.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
.cells.shake .cell{border-color:var(--pink)}
.cell{width:64px;height:76px;border-radius:18px;background:#fff;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font:700 34px/1 'DM Sans',sans-serif;color:var(--ink);box-shadow:0 6px 18px rgba(20,20,20,.06);transition:border-color .2s,transform .2s,box-shadow .2s;position:relative}
.cell.filled{border-color:var(--ink);transform:translateY(-3px);box-shadow:0 10px 22px rgba(20,20,20,.10)}
.cell.cur::after{content:"";width:2px;height:30px;background:var(--pink);animation:blink 1s steps(1) infinite}
.cell.ok{border-color:var(--pink);background:#FFF0F6;color:var(--pink)}

.alert{display:none;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--err);animation:in .25s ease-out both}
.alert.show{display:flex}
.ask{font-size:15px;font-weight:500;text-underline-offset:3px}
.ask[hidden]{display:none}

.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:20px clamp(16px,4vw,56px) 28px;font-size:14px;color:var(--muted)}

@media (max-width:520px){.cell{width:56px;height:68px}.cells{gap:10px}.bubble{font-size:17px}}
@keyframes blink{50%{opacity:0}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="page" id="page">
  <header class="top">
    <div class="brand">Valen Qiu<span> / portfolio</span></div>
    <div class="badge">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      Private preview
    </div>
  </header>

  <main>
    <h1 class="sr">Valen Qiu</h1>
    <div class="name-wrap" id="nameWrap"><canvas id="name" aria-hidden="true"></canvas></div>

    <div class="gate">
      <div class="row">
        <svg class="avatar" id="avatar" role="img" aria-label="Pixel portrait of Valen" viewBox="0 0 17 17" shape-rendering="crispEdges"></svg>
        <div class="bubble">
          <svg class="spark" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#C8105F"><path d="M12 0c.6 6.2 5.8 11.4 12 12-6.2.6-11.4 5.8-12 12-.6-6.2-5.8-11.4-12-12C6.2 11.4 11.4 6.2 12 0z"/></svg>
          <div id="msg" aria-live="polite"></div>
        </div>
      </div>

      <div class="code">
        <label for="code" class="sr">4-digit passcode</label>
        <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="4">
        <div class="cells" id="cells"><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div></div>
      </div>

      <div class="alert" id="alert" role="alert">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg>
        Incorrect passcode
      </div>
      <a class="ask" id="ask" href="#">Don't have a code? Ask Valen</a>
    </div>
  </main>

  <footer class="foot">
    <span>Product Designer · DJ · Studio Founder · Educator</span>
    <span>Toronto, 2026</span>
  </footer>
</div>

<script>
/* ============================================================
   CONFIG: change these
   ------------------------------------------------------------
   passHash: SHA-256 of your 4-digit code (default is "1234").
     To make a new one, run this in any browser console:
     crypto.subtle.digest('SHA-256', new TextEncoder().encode('5678'))
       .then(b => console.log([...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('')))
   redirect: where to go after the right code.
   askHref: where "Don't have a code? Ask Valen" points.
   NOTE: this is a front-end gate. It keeps casual visitors out,
   but it is not real security on a static site.
   ============================================================ */
const CONFIG = {
  passHash: '03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4',
  redirect: 'index.html',   // used when there is no ?next= (gate.js sends visitors here with ?next=)
  storageKey: 'vq-auth',
  askHref: 'mailto:valen.jy.qiu@gmail.com'
};

/* where to go after unlocking: ?next= if it stays on this site, else CONFIG.redirect */
function nextUrl() {
  try {
    const n = new URLSearchParams(location.search).get('next');
    if (n) {
      const u = new URL(n, location.href), dir = location.pathname.replace(/[^/]*$/, '');
      if (u.origin === location.origin && u.pathname.startsWith(dir) && !/password\.html$/.test(u.pathname)) return u.href;
    }
  } catch (e) {}
  return CONFIG.redirect;
}

const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- pixel avatar ---------- */
const AV_ROWS = [
  '.....KKKKKK.....', '...KKHHHHHHKK...', '..KHHhHHHHHHHK..', '..KHhHHHHHHHHK..',
  '.KHHHSSSSSSHHHK.', '.KHHSSSSSSSSHHK.', '.KHHSKSSSSKSHHK.', '.KHHSKSSSSKSHHK.',
  '.KHHBSSSSSSBHHK.', '.KHHSSSMMSSSHHK.', '.KHHHSSSSSSHHHK.', '.KHHHHSSSSHHHHK.',
  '.KHHCCSNNSCCHHK.', 'KHHCPCPPPPCPCHHK', 'KHHCPPPPPPPPCHHK', 'KKKKKKKKKKKKKKKK'
];
const AV_COLORS = { K: '#141414', H: '#2B2B30', h: '#5E5E68', S: '#F6D5C5', B: '#F48FB1', M: '#D9466E', C: '#FFFFFF', P: '#F7C3D8', N: '#C9CBD2' };
function drawAvatar(svg, mood) {
  const R = AV_ROWS.slice();
  if (mood === 'ok') { R[6] = '.KHHSSSSSSSSHHK.'; R[9] = '.KHHSSMSSMSSHHK.'; R[10] = '.KHHHSSMMSSHHHK.'; }
  else if (mood === 'err') { R[10] = '.KHHHSMSSMSHHHK.'; }
  const d = {}; let sh = '';
  R.forEach((row, y) => { for (let x = 0; x < row.length; x++) { const c = row[x]; if (!AV_COLORS[c]) continue; d[c] = (d[c] || '') + 'M' + x + ' ' + y + 'h1v1h-1z'; sh += 'M' + (x + 1) + ' ' + (y + 1) + 'h1v1h-1z'; } });
  let out = '<path d="' + sh + '" fill="#141414" fill-opacity="0.14"/>';
  for (const c in d) out += '<path d="' + d[c] + '" fill="' + AV_COLORS[c] + '"/>';
  svg.innerHTML = out;
}

/* ---------- passcode ---------- */
const $ = (id) => document.getElementById(id);
const page = $('page'), msg = $('msg'), input = $('code'), cellsEl = $('cells'), alertEl = $('alert'), ask = $('ask'), avatar = $('avatar');
const cells = [...cellsEl.children];
ask.href = CONFIG.askHref;

const MSG = {
  idle: 'Hi, this space is private for now.<br>Type the <span class="nowrap">4-digit</span> code to come in.',
  err: "That passcode isn't right.<br>Please check it and try again.",
  ok: "You're in. Welcome to my little corner of the internet."
};
let status = 'idle', code = '', focused = false, locked = false;

function setStatus(st) {
  status = st;
  msg.innerHTML = '<span>' + MSG[st] + '</span><span class="caret"></span>';
  drawAvatar(avatar, st);
  alertEl.classList.toggle('show', st === 'err');
  ask.hidden = st === 'ok';
}
function renderCells() {
  const ok = status === 'ok';
  cells.forEach((c, i) => {
    c.className = 'cell' + (code[i] ? ' filled' : '') + (ok ? ' ok' : '') + (!ok && focused && i === code.length ? ' cur' : '');
    c.textContent = code[i] ? (ok ? code[i] : '•') : '';
  });
}
async function sha256(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join('');
}

input.addEventListener('focus', () => { focused = true; renderCells(); });
input.addEventListener('blur', () => { focused = false; renderCells(); });
input.addEventListener('input', async () => {
  if (locked) { input.value = code; return; }
  const v = input.value.replace(/\D/g, '').slice(0, 4);
  input.value = v; code = v;
  if (v.length < 4) { if (!v.length && status === 'err') setStatus('idle'); renderCells(); return; }
  locked = true;
  renderCells();
  const ok = (await sha256(v)) === CONFIG.passHash;
  if (ok) {
    setStatus('ok'); renderCells();
    try { sessionStorage.setItem(CONFIG.storageKey, '1'); } catch (e) {}
    try { localStorage.setItem(CONFIG.storageKey, '1'); } catch (e) {}
    setTimeout(() => { page.classList.add('leave'); setTimeout(() => { location.href = nextUrl(); }, 560); }, 420);
    return;
  }
  setStatus('err');
  cellsEl.classList.add('shake');
  setTimeout(() => { cellsEl.classList.remove('shake'); code = ''; input.value = ''; locked = false; renderCells(); }, 520);
});

setStatus('idle');
renderCells();

/* ---------- pixel name: flip-tile wave ---------- */
const GLYPHS = {
  V: ['XX..XX', 'XX..XX', 'XX..XX', 'XX..XX', '.XXXX.', '.XXXX.', '..XX..'],
  A: ['.XXXX.', 'XX..XX', 'XX..XX', 'XXXXXX', 'XX..XX', 'XX..XX', 'XX..XX'],
  L: ['XX....', 'XX....', 'XX....', 'XX....', 'XX....', 'XX....', 'XXXXXX'],
  E: ['XXXXXX', 'XX....', 'XX....', 'XXXXX.', 'XX....', 'XX....', 'XXXXXX'],
  N: ['XX..XX', 'XXX.XX', 'XXXXXX', 'XX.XXX', 'XX..XX', 'XX..XX', 'XX..XX'],
  Q: ['.XXXX.', 'XX..XX', 'XX..XX', 'XX..XX', 'XX.XXX', '.XXXX.', '....XX'],
  I: ['XX', 'XX', 'XX', 'XX', 'XX', 'XX', 'XX'],
  U: ['XX..XX', 'XX..XX', 'XX..XX', 'XX..XX', 'XX..XX', 'XX..XX', '.XXXX.']
};
function makeFlipName(canvas, wrap, text, maxCell) {
  const ctx = canvas.getContext('2d');
  const ptr = { active: false, x: -999, y: -999 };
  let tiles = [], cell = 10, W = 0, H = 0, idle = false, wasActive = false;
  const F = 320, HOLD = 650;

  function setup(intro) {
    const cssW = canvas.clientWidth; if (!cssW) return;
    const rel = []; let col = 0;
    for (const ch of text) {
      if (ch === ' ') { col += 3; continue; }
      const g = GLYPHS[ch];
      g.forEach((row, r) => { for (let c = 0; c < row.length; c++) if (row[c] === 'X') rel.push([col + c, r]); });
      col += g[0].length + 1;
    }
    const cols = col - 1;
    cell = Math.max(6, Math.min(maxCell, Math.floor(cssW / (cols + 2))));
    const cssH = Math.round(cell * 9.4);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.style.aspectRatio = 'auto'; canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = cssW; H = cssH;
    const ox = Math.round((cssW - cols * cell) / 2), oy = Math.round(cell * 1.1), now = performance.now();
    const doIntro = intro && !REDUCED;
    tiles = rel.map(([c, r]) => ({ x: ox + c * cell, y: oy + r * cell, ts: doIntro ? now + 250 + c * 24 + r * 10 : -1e9, intro: doIntro }));
    idle = false;
  }
  function angle(t, now) {
    let dt = now - t.ts;
    if (t.intro) { if (dt < 0) return Math.PI; dt += F + HOLD; }
    if (dt < 0 || dt > 2 * F + HOLD) return 0;
    const e = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
    if (dt < F) return e(dt / F) * Math.PI;
    if (dt < F + HOLD) return Math.PI;
    return Math.PI + e((dt - F - HOLD) / F) * Math.PI;
  }
  function trigger(px, py, radius, perCell) {
    const now = performance.now();
    for (const t of tiles) {
      const d = Math.hypot(t.x + cell / 2 - px, t.y + cell / 2 - py);
      if (d > radius) continue;
      if (now < t.ts + (t.intro ? 340 : 1310)) continue;
      t.intro = false;
      t.ts = now + (d / cell) * perCell;
    }
  }
  function frame() {
    if (!REDUCED) {
      if (ptr.active && !wasActive) trigger(ptr.x, ptr.y, 1e9, 22);
      else if (ptr.active) trigger(ptr.x, ptr.y, cell * 2.2, 40);
    }
    wasActive = ptr.active;
    const now = performance.now();
    const angs = tiles.map((t) => angle(t, now));
    let busy = false;
    for (let k = 0; k < tiles.length; k++) if (angs[k] !== 0 || now < tiles[k].ts) { busy = true; break; }
    if (!busy) { if (idle) return; idle = true; } else idle = false;

    ctx.clearRect(0, 0, W, H);
    const s = cell - 1, th = Math.max(2, cell * 0.22);
    for (let k = 0; k < tiles.length; k++) {
      const t = tiles[k], a = angs[k];
      const w = s * Math.max(0.15, Math.abs(Math.cos(a)));
      const off = cell * 0.16 + Math.abs(Math.sin(a)) * cell * 0.3;
      ctx.fillStyle = 'rgba(20,20,20,0.12)';
      ctx.fillRect(t.x + (s - w) / 2 + off, t.y + off, w, s);
    }
    for (let k = 0; k < tiles.length; k++) {
      const t = tiles[k], a = angs[k];
      const cosA = Math.cos(a), sinA = Math.sin(a);
      const cx = t.x + s / 2, cy = t.y + s / 2;
      const hw = (s / 2) * Math.abs(cosA);
      const persp = 0.24 * sinA;
      const hl = (s / 2) * (1 + persp), hr = (s / 2) * (1 - persp);
      const front = cosA >= 0;
      const ew = th * Math.abs(sinA);
      if (ew > 0.4) {
        const leftNear = sinA > 0, eh = leftNear ? hl : hr;
        ctx.fillStyle = front ? '#2C2C31' : '#8E0B47';
        ctx.fillRect(leftNear ? cx - hw - ew : cx + hw, cy - eh, ew, eh * 2);
      }
      if (hw < 0.4) continue;
      ctx.beginPath();
      ctx.moveTo(cx - hw, cy - hl); ctx.lineTo(cx + hw, cy - hr); ctx.lineTo(cx + hw, cy + hr); ctx.lineTo(cx - hw, cy + hl);
      ctx.closePath();
      ctx.fillStyle = front ? '#141414' : '#D6136B'; ctx.fill();
      const shade = (1 - Math.abs(cosA)) * 0.5;
      if (shade > 0.01) { ctx.fillStyle = 'rgba(0,0,0,' + shade.toFixed(3) + ')'; ctx.fill(); }
      const glint = Math.max(0, sinA * (front ? 1 : -1)) * 0.3;
      if (glint > 0.01) { ctx.fillStyle = 'rgba(255,255,255,' + glint.toFixed(3) + ')'; ctx.fill(); }
      ctx.beginPath();
      ctx.moveTo(cx - hw, cy - hl); ctx.lineTo(cx + hw, cy - hr);
      ctx.lineTo(cx + hw, cy - hr + hr * 0.36); ctx.lineTo(cx - hw, cy - hl + hl * 0.36);
      ctx.closePath();
      ctx.fillStyle = front ? 'rgba(255,255,255,0.13)' : 'rgba(255,255,255,0.3)'; ctx.fill();
    }
  }
  const move = (e) => {
    const r = canvas.getBoundingClientRect();
    ptr.x = e.clientX - r.left; ptr.y = e.clientY - r.top;
    ptr.active = e.pointerType === 'mouse' || e.buttons > 0 || e.type === 'pointerdown';
  };
  wrap.addEventListener('pointermove', move);
  wrap.addEventListener('pointerdown', move);
  wrap.addEventListener('pointerleave', () => { ptr.active = false; });
  wrap.addEventListener('pointerup', (e) => { if (e.pointerType !== 'mouse') ptr.active = false; });
  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => setup(false), 150); });
  const start = () => setup(true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
  (function loop() { if (tiles.length) frame(); requestAnimationFrame(loop); })();
}
makeFlipName($('name'), $('nameWrap'), 'VALEN QIU', 30);
</script>
</body>
</html>
